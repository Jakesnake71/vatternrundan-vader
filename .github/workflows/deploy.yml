name: deploy

# Triggar en Render-deploy vid varje push till main (eftersom repot lades till
# via URL utan GitHub-app-koppling fyrar inte Renders egen auto-deploy).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d8lg0a1o3t8c73fk6qd0
        run: |
          echo "Triggar deploy för $SERVICE_ID"
          curl -fsS -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
